name: Verify APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        default: build-4

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect APK
        run: |
          curl -L -sSf -o app.apk "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/BeanLeafCNN.apk"
          ls -la app.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging app.apk | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|application-label:" || true
          "$BT/apksigner" verify --verbose --print-certs app.apk | head -12 || true
          unzip -l app.apk | grep "lib/" || true
          "$BT/zipalign" -c -P 16 4 app.apk && echo "zipalign 16KB OK" || echo "zipalign 16KB check failed"
          "$BT/zipalign" -c 4 app.apk && echo "zipalign 4 OK" || echo "zipalign 4 check failed"
